services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: chatpw
      POSTGRES_DB: chat
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat -d chat"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: migrate/migrate:v4.17.0
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../migrations:/migrations
    command:
      - "-path"
      - "/migrations"
      - "-database"
      - "postgres://chat:chatpw@postgres:5432/chat?sslmode=disable"
      - "up"

  server:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      HTTP_ADDR: ":8080"
      POSTGRES_DSN: "postgres://chat:chatpw@postgres:5432/chat?sslmode=disable"
      REDIS_ADDR: "redis:6379"
      JWT_SECRET: "change-me-in-production"
      LOG_FORMAT: "json"
      LOG_LEVEL: "info"
    ports:
      - "8080:8080"

volumes:
  pgdata:
